<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Truegle - The unbiased, transparent, and secure search engine. Get multiple perspectives on any topic without algorithmic bias or tracking." />
    <meta name="keywords" content="Truegle, unbiased search, transparent search, secure search, multiple perspectives, no tracking, privacy-focused" />
    <meta name="author" content="Truegle Team" />
    <!-- Impact.com affiliate network site verification -->
    <meta name="impact-site-verification" value="ccda0e8a-fd60-4ba7-a741-c4f9f625aa7f" />
    <link rel="canonical" href="https://truegle.info/" />
    <!-- Make Truegle a selectable default search engine in browsers -->
    <link rel="search" type="application/opensearchdescription+xml" title="Truegle" href="/opensearch.xml" />
    <!-- PWA: enables "Add to Home Screen" / install -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="/og-image.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Truegle" />
    <!-- Open Graph -->
    <meta property="og:title" content="Truegle - Unbiased Search Engine" />
    <meta property="og:description" content="Search without bias. Discover truth from multiple perspectives. No tracking, no cookies, no hidden agendas." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://truegle.info/" />
    <meta property="og:site_name" content="Truegle" />
    <meta property="og:image" content="https://truegle.info/og-image.png" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Truegle - Unbiased Search Engine" />
    <meta name="twitter:description" content="Search without bias. Discover truth from multiple perspectives. No tracking, no cookies, no hidden agendas." />
    <meta name="twitter:image" content="https://truegle.info/og-image.png" />
    <!-- Bing Webmaster Tools verification -->
    <meta name="msvalidate.01" content="11AA6A4FA968D5ABEC8DF44C8E8C35C0" />
    <!-- IndexNow key (Bing, Yandex instant indexing) -->
    <meta name="indexnow-key" content="11aa6a4fa968d5abec8df44c8e8c35c0" />
    <!-- AI crawler guidance -->
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLMs.txt" />
    <!-- Parody Disclaimer -->
    <meta name="disclaimer" content="Truegle is not affiliated with, endorsed by, or connected to Google LLC. This is an independent search engine project." />
    <!-- Structured Data: Organization + WebSite with SearchAction (sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://truegle.info/#organization",
          "name": "Truegle",
          "url": "https://truegle.info/",
          "logo": "https://truegle.info/og-image.png",
          "description": "The unbiased, transparent, and secure search engine."
        },
        {
          "@type": "WebSite",
          "@id": "https://truegle.info/#website",
          "url": "https://truegle.info/",
          "name": "Truegle",
          "publisher": { "@id": "https://truegle.info/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://truegle.info/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    <!-- Google Fonts - Inter & Barlow for professional typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Mapbox GL JS CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.18.0/mapbox-gl.css" rel="stylesheet">
    <title>Truegle - Unbiased, Transparent & Secure Search</title>
    <!-- Zero-latency fallback paint: applies before any network request
         finishes, so the pre-hydration window (real on slow connections)
         never shows a bare unstyled document. React replaces all of this
         the instant it mounts. #seo-home only matches scripts/prerender.mjs's
         "/" snapshot (see HomeStaticContent.jsx) - the other prerendered
         routes (about/privacy/terms/advertise) already render the real,
         fully-styled page components, so they don't need it. -->
    <style>
      html, body { background: #000; }
      #seo-home {
        max-width: 640px;
        margin: 0 auto;
        padding: 4rem 1.5rem 2rem;
        text-align: center;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      #seo-home h1 {
        font-size: 1.75rem;
        font-weight: 800;
        margin-bottom: 1rem;
        text-wrap: balance;
        background: linear-gradient(90deg, #4285f4, #ea4335, #fbbc05, #34a853);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #seo-home h2 { color: #f1f5f9; margin: 2rem 0 0.75rem; font-size: 1.1rem; }
      #seo-home p { line-height: 1.6; margin-bottom: 0.75rem; }
      #seo-home ul { list-style: none; padding: 0; text-align: left; max-width: 420px; margin: 0 auto; }
      #seo-home li { margin-bottom: 0.5rem; }
      #seo-home nav { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-top: 2rem; }
      #seo-home nav a { color: #60a5fa; text-decoration: none; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
