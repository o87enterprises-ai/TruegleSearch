    <meta name="description" content="Truegle - The unbiased, transparent, and secure search engine. Get multiple perspectives on any topic without algorithmic bias or tracking." />
    <meta name="keywords" content="Truegle, unbiased search, transparent search, secure search, multiple perspectives, no tracking, privacy-focused" />

    <link rel="canonical" href="https://truegle.info/" />
    <!-- Make Truegle a selectable default search engine in browsers -->
    <link rel="search" type="application/opensearchdescription+xml" title="Truegle" href="/opensearch.xml" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="msvalidate.01" content="11AA6A4FA968D5ABEC8DF44C8E8C35C0" />

    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLMs.txt" />
    <!-- Parody Disclaimer -->
    <meta name="disclaimer" content="Truegle is not affiliated with, endorsed by, or connected to Google LLC. This is an independent search engine project." />
    <!-- Structured Data: Organization + WebSite with SearchAction (sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://truegle.info/#organization",
          "name": "Truegle",
          "url": "https://truegle.info/",
          "logo": "https://truegle.info/og-image.png",
          "description": "The unbiased, transparent, and secure search engine."
        },
        {
          "@type": "WebSite",
          "@id": "https://truegle.info/#website",
          "url": "https://truegle.info/",
          "name": "Truegle",
          "publisher": { "@id": "https://truegle.info/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://truegle.info/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    <!-- Google Fonts - Inter & Barlow for professional typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.18.0/mapbox-gl.css" rel="stylesheet">
    <title>Truegle - Unbiased, Transparent & Secure Search</title>
    <!-- Zero-latency fallback paint: applies before any network request
         finishes, so the pre-hydration window (real on slow connections)
         never shows a bare unstyled document. React replaces all of this
         the instant it mounts. #seo-home only matches scripts/prerender.mjs's
         "/" snapshot (see HomeStaticContent.jsx) - the other prerendered
         routes (about/privacy/terms/advertise) already render the real,
         fully-styled page components, so they don't need it. -->
    <style>
      html, body { background: #000; }
      #seo-home {
        max-width: 640px;
        margin: 0 auto;
        padding: 4rem 1.5rem 2rem;
        text-align: center;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      #seo-home h1 {
        font-size: 1.75rem;
        font-weight: 800;
        margin-bottom: 1rem;
        text-wrap: balance;
        background: linear-gradient(90deg, #4285f4, #ea4335, #fbbc05, #34a853);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #seo-home h2 { color: #f1f5f9; margin: 2rem 0 0.75rem; font-size: 1.1rem; }
      #seo-home p { line-height: 1.6; margin-bottom: 0.75rem; }
      #seo-home ul { list-style: none; padding: 0; text-align: left; max-width: 420px; margin: 0 auto; }
      #seo-home li { margin-bottom: 0.5rem; }
      #seo-home nav { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-top: 2rem; }
      #seo-home nav a { color: #60a5fa; text-decoration: none; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <!-- Pre-React loading screen — shown while the JS bundle downloads.
         Removed by main.jsx immediately after createRoot() succeeds. -->
    <div id="truegle-loader" style="position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.4s ease">
      <style>
        @keyframes tg-pulse{0%,100%{opacity:.15}50%{opacity:.7}}
        @keyframes tg-bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
        .tg-star{position:absolute;border-radius:50%;background:#fff;animation:tg-pulse var(--d,3s) var(--dl,0s) ease-in-out infinite}
        .tg-dot{width:6px;height:6px;border-radius:50%;background:#60a5fa;animation:tg-bounce 1.2s var(--dl,0s) ease-in-out infinite}
      </style>
      <!-- stars -->
      <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none">
        <div class="tg-star" style="width:2px;height:2px;top:8%;left:15%;--d:2.4s;--dl:0.1s;opacity:.4"></div>
        <div class="tg-star" style="width:1px;height:1px;top:20%;left:72%;--d:3.1s;--dl:0.5s;opacity:.5"></div>
        <div class="tg-star" style="width:2px;height:2px;top:35%;left:88%;--d:2.7s;--dl:0.3s;opacity:.3"></div>
        <div class="tg-star" style="width:1px;height:1px;top:55%;left:5%;--d:3.5s;--dl:0.7s;opacity:.5"></div>
        <div class="tg-star" style="width:2px;height:2px;top:70%;left:42%;--d:2.2s;--dl:0.2s;opacity:.4"></div>
        <div class="tg-star" style="width:1px;height:1px;top:82%;left:90%;--d:3.8s;--dl:0.9s;opacity:.35"></div>
        <div class="tg-star" style="width:2px;height:2px;top:12%;left:55%;--d:2.9s;--dl:1.1s;opacity:.45"></div>
        <div class="tg-star" style="width:1px;height:1px;top:48%;left:28%;--d:3.3s;--dl:0.4s;opacity:.4"></div>
        <div class="tg-star" style="width:2px;height:2px;top:91%;left:61%;--d:2.6s;--dl:0.8s;opacity:.35"></div>
        <div class="tg-star" style="width:1px;height:1px;top:63%;left:77%;--d:3.6s;--dl:1.3s;opacity:.5"></div>
        <div class="tg-star" style="width:2px;height:2px;top:4%;left:33%;--d:2.1s;--dl:0.6s;opacity:.4"></div>
        <div class="tg-star" style="width:1px;height:1px;top:27%;left:9%;--d:3.4s;--dl:1.0s;opacity:.3"></div>
        <div class="tg-star" style="width:2px;height:2px;top:76%;left:19%;--d:2.8s;--dl:0.2s;opacity:.45"></div>
        <div class="tg-star" style="width:1px;height:1px;top:40%;left:96%;--d:3.2s;--dl:1.4s;opacity:.5"></div>
        <div class="tg-star" style="width:2px;height:2px;top:58%;left:50%;--d:2.3s;--dl:0.7s;opacity:.4"></div>
      </div>
      <!-- logo -->
      <img src="/og-image.png" alt="Truegle" style="width:80px;height:80px;object-fit:contain;margin-bottom:24px;filter:drop-shadow(0 0 18px rgba(139,92,246,0.5))" onerror="this.style.display='none'" />
      <!-- bouncing dots -->
      <div style="display:flex;gap:6px;margin-top:4px">
        <div class="tg-dot" style="--dl:0s"></div>
        <div class="tg-dot" style="--dl:0.15s"></div>
        <div class="tg-dot" style="--dl:0.3s"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
