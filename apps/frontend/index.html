        z-index: 1;
      }

        animation: seo-twinkle 4s ease-in-out infinite alternate;
      }
      @keyframes seo-twinkle {

        100% { opacity: 1; }
      }
      #seo-logo {
        display: block;
        margin: 0 auto 1.5rem;
        height: 72px;
        width: auto;
        filter: drop-shadow(0 0 18px rgba(0,229,255,.4));

        mix-blend-mode: screen;
      }
