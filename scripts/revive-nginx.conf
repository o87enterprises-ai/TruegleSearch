# nginx reverse-proxy config for Revive Adserver on EC2.
# Deploy to: /etc/nginx/conf.d/revive.conf
# Then run:  sudo nginx -t && sudo systemctl reload nginx
#
# Traffic flow:
#   Cloudflare (HTTPS → port 443) → nginx (port 80) → Revive Docker (port 9090)
#
# Requirements:
#   - EC2 security group allows port 80 from Cloudflare IPs (or 0.0.0.0/0 if behind CF)
#   - Cloudflare DNS A record: ads.truegle.info → 44.236.219.63  (Proxied = ON)
#   - Cloudflare will handle TLS; backend stays HTTP.

server {
    listen 80;
    server_name ads.truegle.info;

    # Forward all traffic to the Revive container
    location / {
        proxy_pass         http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Revive uses cookies for session tracking
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;

        # Increase buffer/timeout for ad creatives
        proxy_read_timeout 30s;
        proxy_buffering    off;
    }

    # Health check endpoint (returns 200 for Cloudflare health monitors)
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
