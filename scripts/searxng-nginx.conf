# nginx reverse-proxy config for SearXNG on EC2.
# Deploy to: /etc/nginx/conf.d/searxng.conf
# Then run:  sudo nginx -t && sudo systemctl reload nginx
#
# WHY THIS EXISTS: SearXNG was reachable at http://44.236.219.63:8080 — a raw,
# unauthenticated metasearch proxy open to the whole internet. Anyone could use
# it as a free proxy, and that traffic left under OUR datacenter Elastic IP,
# which is what gets upstream engines (DDG, Brave) to start CAPTCHA'ing and
# 403'ing us. Fronting it with Cloudflare lets us (a) serve it over TLS on a
# real name, (b) put Cloudflare's WAF/bot rules in front of it, and (c) close
# port 8080 in the security group so the raw origin is no longer exposed.
#
# Traffic flow (identical to the Revive and Morty vhosts already on this box):
#   Cloudflare (HTTPS 443) → nginx (port 80) → SearXNG Docker (127.0.0.1:8888)
#
# Requirements:
#   - Cloudflare DNS A record: search.truegle.info → 44.236.219.63 (Proxied = ON)
#   - Zone SSL mode is "Flexible" (CF↔origin over HTTP:80), same as ads/anon.
#   - EC2 security group already allows port 80 (shared with the Revive vhost).
#   - Cloudflare handles TLS; origin stays HTTP. Port 8080 is retired once
#     SEARXNG_URL on Vercel points at https://search.truegle.info and verifies.

server {
    listen 80;
    server_name search.truegle.info;

    # Only Cloudflare should be talking to this origin. This is defence in depth
    # on top of the security-group rule: even if port 80 is reachable, a direct
    # hit that didn't come through Cloudflare gets nothing. Comment out during
    # first-run testing if you need to curl the origin directly, then restore.
    # (Cloudflare publishes these ranges at https://www.cloudflare.com/ips/)
    # include /etc/nginx/cloudflare-ips.conf;   # set of `allow <cidr>;` lines
    # deny all;

    location / {
        proxy_pass         http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # SearXNG's limiter keys on the client IP; hand it Cloudflare's, not
        # nginx's loopback, so rate-limiting still means something.
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering    off;
    }

    # Cloudflare health monitor target.
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
