name: Citation Engine (SEO/AEO/GEO)

# Autopilot: one high-value, evergreen answer page per day, seeded by
# anonymous demand + the vetted keyword universe, drafted through the free-tier
# AI fallback router, quality-gated, then opened as a PR for review.
#
# WHY GITHUB ACTIONS: production is Vercel serverless (no persistent process,
# function timeouts) and every citable page is a static file built at Cloudflare
# deploy time — so the engine needs a scheduler + real compute + git write, all
# of which Actions provides for $0. This workflow only runs from the default
# branch once merged.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   GROQ_API_KEY        (free: console.groq.com — primary)   [required]
#   GEMINI_API_KEY      (free: aistudio.google.com — fallback)[recommended]
#   DATABASE_URL        (Neon — read trending; a read-only role is ideal)
#   Optional: GROQ_API_KEY_2 … GROQ_API_KEY_5 (more free-tier headroom)

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate & preview only (no commit, no PR)'
        type: boolean
        default: false

concurrency:
  group: citation-engine
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: apps/backend
        run: npm ci

      - name: Generate a page
        id: gen
        env:
          # Real free-tier secrets
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Dummy values so config/env.js validation passes when the provider
          # services load — the engine never uses these (no auth, no web search).
          JWT_SECRET: ci-not-used
          ENCRYPTION_KEY: ci-not-used
          GOOGLE_API_KEY: ci-not-used
          GOOGLE_SEARCH_ENGINE_ID: ci-not-used
          NODE_ENV: production
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node apps/backend/services/optimization/run.js generate --dry-run
          else
            node apps/backend/services/optimization/run.js generate
          fi

      - name: Validate generated JSX compiles
        if: steps.gen.outputs.published == 'true'
        # Syntax-check the modified content file BEFORE opening a PR — a broken
        # entry would fail the entire Cloudflare Pages build, not just the page.
        run: npx --yes esbuild apps/frontend/src/content/blogPosts.jsx --loader:.jsx=jsx --outfile=/dev/null

      - name: Open pull request
        if: steps.gen.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.gen.outputs.slug }}
          TITLE: ${{ steps.gen.outputs.title }}
          SOURCE: ${{ steps.gen.outputs.source }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH="citation-engine/${SLUG}"
          git config user.name  "truegle-citation-engine[bot]"
          git config user.email "citation-engine@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add apps/frontend/src/content/blogPosts.jsx \
                  apps/frontend/public/sitemap.xml \
                  apps/frontend/public/llms.txt
          git commit -m "content: auto-publish /blog/${SLUG}" \
                     -m "New evergreen answer page (${SOURCE}-seeded, anonymous). Quality-gated by the citation engine; review before merge."
          git push -u origin "$BRANCH" --force
          gh pr create \
            --base "$BASE" --head "$BRANCH" \
            --title "📝 New page: ${TITLE}" \
            --body "$(cat <<EOF
          Auto-generated by the **citation engine** (SEO/AEO/GEO) — a new evergreen answer page.

          - **URL:** \`/blog/${SLUG}\`
          - **Seeded by:** ${SOURCE} (anonymous demand — no user/query data published)
          - It passed the quality gate (length, target phrase in the first 15 words, real FAQ, no fabricated citations, no personal data).

          **Before merging, skim for:** factual accuracy, tone, and that it reads as genuinely useful. Merging deploys it to Cloudflare Pages. Close the PR to reject; the engine will pick a different topic next run.
          EOF
          )" || echo "PR may already exist for $BRANCH"
