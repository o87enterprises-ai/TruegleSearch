name: Android APK
# Builds the Capacitor Android shell (apps/android) into a debug-signed APK, free on GitHub's runners.
# Run it by hand (Actions -> Android APK -> Run workflow) or push a tag like android-v0.1.0,
# which also attaches the APK to a GitHub Release (Obtainium / IzzyOnDroid read that).
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm --prefix apps/frontend run build
      - run: npm --prefix apps/android install --no-audit --no-fund
      - run: npx cap sync android
        working-directory: apps/android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: apps/android/android
      - run: cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk truegle.apk
      - uses: actions/upload-artifact@v4
        with: { name: truegle-apk, path: truegle.apk }
      - if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with: { files: truegle.apk }
